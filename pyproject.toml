[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "polyterm"
version = "0.1.0"
description = "Polymer termination kinetics analysis for fast-initiating polymerizations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["polymer", "kinetics", "termination", "molecular weight", "SEC", "GPC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "mpmath>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "matplotlib>=3.5",
]

docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/polyterm"
Documentation = "https://polyterm.readthedocs.io"
Repository = "https://github.com/yourusername/polyterm"
"Bug Tracker" = "https://github.com/yourusername/polyterm/issues"

[tool.setuptools]
packages = ["polyterm", "polyterm.core", "polyterm.models"]
# Note: calibration.py is now included in the main polyterm package

[tool.setuptools.package-data]
polyterm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=polyterm --cov-report=html --cov-report=term"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
